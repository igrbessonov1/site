<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<meta name="mobile-web-app-capable" content="yes">
<title>Welcome</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&family=Onest:wght@400;500&display=swap">
<style>
:root{
  --bg:#f5f1e8; --fg:#14213d; --muted:#4b5672; --accent:#14213d; --on-accent:#f5f1e8; --mark:#ffb703;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0e1730; --fg:#f5f1e8; --muted:#aab3c9; --accent:#ffb703; --on-accent:#14213d; --mark:#ffb703}
}
:root[data-theme="dark"]{--bg:#0e1730; --fg:#f5f1e8; --muted:#aab3c9; --accent:#ffb703; --on-accent:#14213d; --mark:#ffb703}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex}
main{margin:auto 0;padding:32px 28px;width:100%;max-width:480px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
.mark{width:72px;height:72px;border-radius:20px;background:var(--fg);color:var(--mark);display:grid;place-items:center;font:600 44px/1 "Unbounded",Arial,sans-serif}
h1{font:600 clamp(40px,13vw,60px)/1.05 "Unbounded",Arial,sans-serif;margin:8px 0 0;letter-spacing:-.02em}
p{font-size:18px;line-height:1.5;color:var(--muted);margin:0;max-width:34ch}
button{margin-top:12px;align-self:flex-start;font:500 18px "Onest",system-ui,sans-serif;background:var(--accent);color:var(--on-accent);border:0;border-radius:16px;padding:16px 28px;min-height:52px;cursor:pointer;transition:transform .15s}
button:active{transform:scale(.97)}
button:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
#msg{min-height:1.5em;color:var(--fg);font-weight:500}
@media (prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">W</div>
  <h1>Добро пожаловать</h1>
  <p>Это первый экран твоего приложения. Дальше добавим всё, что нужно.</p>
  <button id="start" type="button">Начать</button>
  <p id="msg" aria-live="polite"></p>
</main>
<script>
document.getElementById('start').addEventListener('click',function(){
  document.getElementById('msg').textContent='Готово. Приложение работает.';
});
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){});}
</script>
</body>
</html>
